<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc"><title id="title">문틀과 벽의 경계는 폭·깊이·끝선을 함께</title><desc id="desc">정면 확대 · 작은 틈도 계획된 마감이어야 합니다. 틈을 몇 mm로 할지보다 어떻게 시작하고 끝낼지가 중요합니다.</desc><rect width="1000" height="680" rx="16" fill="#f3f6fa"/><g font-family="Malgun Gothic, sans-serif"><text x="36" y="48" font-size="32" fill="#192d43">문틀과 벽의 경계는 폭·깊이·끝선을 함께</text><text x="36" y="86" font-size="24" fill="#192d43">정면 확대 · 작은 틈도 계획된 마감이어야 합니다.</text><rect x="28" y="112" width="456" height="410" fill="white"/><rect x="516" y="112" width="456" height="410" fill="white"/><text x="50" y="153" font-size="26" fill="#192d43">A. 경계가 불규칙한 경우</text><text x="538" y="153" font-size="26" fill="#192d43">B. 경계선을 계획한 경우</text><rect x="72" y="195" width="200" height="270" fill="#eadfd1"/><rect x="286" y="195" width="165" height="270" fill="#ced7dd"/><path d="M276 195L286 260L272 320L290 389L277 465" fill="none" stroke="#8b715d" stroke-width="7" /><rect x="560" y="195" width="170" height="270" fill="#eadfd1"/><rect x="744" y="195" width="185" height="270" fill="#ced7dd"/><rect x="730" y="195" width="14" height="270" fill="#647787"/><text x="99" y="332" font-size="24" fill="#192d43">벽</text><text x="321" y="332" font-size="24" fill="#192d43">문틀</text><text x="614" y="332" font-size="24" fill="#192d43">벽</text><text x="784" y="332" font-size="24" fill="#192d43">문틀</text><text x="61" y="504" font-size="20" fill="#192d43">임의로 메우면 선이 흐트러짐</text><text x="548" y="504" font-size="20" fill="#192d43">재료 두께와 접합 상세 확인</text><text x="38" y="566" font-size="23" fill="#192d43">틈을 몇 mm로 할지보다 어떻게 시작하고 끝낼지가 중요합니다.</text><text x="38" y="613" font-size="20" fill="#566675">표현은 개념 비교입니다. 틈의 수치·밀폐·방화 성능은 별도 검토합니다.</text><text x="38" y="649" font-size="18" fill="#566675">공간한쪽 제작 · 설명용 개념도 / 비축척 / 제작·시공도면 아님</text></g></svg>
