<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc"><title id="title">타일 모서리 마감은 옆 단면으로 비교합니다</title><desc id="desc">날렵한 선과 충격 보호, 교체 범위를 함께 봅니다. 두 방식 모두 실제 모서리 샘플로 촉감과 선을 비교하세요.</desc><rect width="1000" height="680" rx="16" fill="#f3f6fa"/><g font-family="Malgun Gothic, sans-serif"><text x="36" y="48" font-size="32" fill="#192d43">타일 모서리 마감은 옆 단면으로 비교합니다</text><text x="36" y="86" font-size="24" fill="#192d43">날렵한 선과 충격 보호, 교체 범위를 함께 봅니다.</text><rect x="28" y="112" width="456" height="410" fill="white"/><rect x="516" y="112" width="456" height="410" fill="white"/><text x="50" y="153" font-size="26" fill="#192d43">A. 모서리를 맞댄 마감</text><text x="538" y="153" font-size="26" fill="#192d43">B. 코너 보호재 마감</text><rect x="100" y="235" width="200" height="200" fill="#d7d8d7"/><path d="M80 215H320L300 235H100V435L80 455Z" fill="#c7b69e"/><path d="M80 215L100 235" fill="none" stroke="#a76f48" stroke-width="2" /><text x="130" y="300" font-size="22" fill="#192d43">바탕</text><path d="M54 193L83 217" fill="none" stroke="#a76f48" stroke-width="3" /><text x="52" y="186" font-size="19" fill="#192d43">노출된 끝</text><rect x="600" y="235" width="200" height="200" fill="#d7d8d7"/><rect x="600" y="215" width="220" height="20" fill="#c7b69e"/><rect x="580" y="235" width="20" height="220" fill="#c7b69e"/><rect x="580" y="215" width="20" height="20" fill="#6f889d"/><path d="M550 188L588 219" fill="none" stroke="#255a96" stroke-width="3" /><text x="538" y="185" font-size="19" fill="#192d43">코너 보호재</text><text x="630" y="300" font-size="22" fill="#192d43">바탕</text><text x="62" y="493" font-size="24" fill="#192d43">끝면 충격·깨짐을 확인</text><text x="548" y="493" font-size="24" fill="#192d43">색·두께·교체 방법을 확인</text><text x="38" y="566" font-size="23" fill="#192d43">두 방식 모두 실제 모서리 샘플로 촉감과 선을 비교하세요.</text><text x="38" y="613" font-size="20" fill="#566675">보호재가 모든 파손을 막는 것은 아닙니다. 절단 작업은 전문 공정입니다.</text><text x="38" y="649" font-size="18" fill="#566675">공간한쪽 제작 · 설명용 개념도 / 비축척 / 제작·시공도면 아님</text></g></svg>
