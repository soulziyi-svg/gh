<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc"><title id="title">거울 높이는 사용하는 사람을 기준으로</title><desc id="desc">설치 전 종이·테이프로 범위를 표시하고 가족이 직접 확인합니다. 거울 크기·설치 높이·사용 위치를 함께 비교합니다.</desc><rect width="1000" height="680" rx="16" fill="#f3f6fa"/><g font-family="Malgun Gothic, sans-serif"><text x="36" y="48" font-size="32" fill="#192d43">거울 높이는 사용하는 사람을 기준으로</text><text x="36" y="86" font-size="24" fill="#192d43">설치 전 종이·테이프로 범위를 표시하고 가족이 직접 확인합니다.</text><rect x="28" y="112" width="456" height="410" fill="white"/><rect x="516" y="112" width="456" height="410" fill="white"/><text x="50" y="153" font-size="26" fill="#192d43">A. 크기만 보고 설치</text><text x="538" y="153" font-size="26" fill="#192d43">B. 상단·하단과 시야 확인</text><rect x="310" y="205" width="75" height="125" fill="#bad1dd"/><g transform="translate(180 265) scale(1)"><circle cx="0" cy="0" r="17" fill="#667e95"/><path d="M0 20V100M-35 60L0 35L35 60M0 100L-25 160M0 100L25 160" fill="none" stroke="#667e95" stroke-width="13" stroke-linecap="round"/></g><rect x="815" y="195" width="75" height="270" fill="#bad1dd"/><g transform="translate(620 250) scale(1.05)"><circle cx="0" cy="0" r="17" fill="#667e95"/><path d="M0 20V100M-35 60L0 35L35 60M0 100L-25 160M0 100L25 160" fill="none" stroke="#667e95" stroke-width="13" stroke-linecap="round"/></g><path d="M550 475H925" fill="none" stroke="#a78763" stroke-width="3" /><path d="M60 475H455" fill="none" stroke="#a78763" stroke-width="3" /><text x="70" y="505" font-size="19" fill="#192d43">전신이 보이는지 확인 필요</text><text x="549" y="505" font-size="19" fill="#192d43">아이·성인 모두 서서 확인</text><path d="M902 195V465" fill="none" stroke="#255a96" stroke-width="3" /><text x="739" y="185" font-size="19" fill="#192d43">상단</text><text x="747" y="470" font-size="19" fill="#192d43">하단</text><text x="38" y="566" font-size="23" fill="#192d43">거울 크기·설치 높이·사용 위치를 함께 비교합니다.</text><text x="38" y="613" font-size="20" fill="#566675">그림은 광학 계산도가 아닙니다. 고정·충돌·모서리 안전을 별도 확인합니다.</text><text x="38" y="649" font-size="18" fill="#566675">공간한쪽 제작 · 설명용 개념도 / 비축척 / 제작·시공도면 아님</text></g></svg>
