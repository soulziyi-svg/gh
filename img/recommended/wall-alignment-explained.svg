<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc"><title id="title">긴 선은 바탕의 작은 오차도 드러냅니다</title><desc id="desc">정면 비교 · 점선은 공유해야 할 수평 기준선입니다. 천장·벽·가구가 만나는 선을 같은 기준으로 확인합니다.</desc><rect width="1000" height="680" rx="16" fill="#f3f6fa"/><g font-family="Malgun Gothic, sans-serif"><text x="36" y="48" font-size="32" fill="#192d43">긴 선은 바탕의 작은 오차도 드러냅니다</text><text x="36" y="86" font-size="24" fill="#192d43">정면 비교 · 점선은 공유해야 할 수평 기준선입니다.</text><rect x="28" y="112" width="456" height="410" fill="white"/><rect x="516" y="112" width="456" height="410" fill="white"/><text x="50" y="153" font-size="26" fill="#192d43">A. 바탕 오차를 남긴 경우</text><text x="538" y="153" font-size="26" fill="#192d43">B. 바탕을 확인·보수한 경우</text><path d="M65 230H450" fill="none" stroke="#255a96" stroke-width="3" stroke-dasharray="7 5"/><path d="M550 230H935" fill="none" stroke="#255a96" stroke-width="3" stroke-dasharray="7 5"/><path d="M65 258Q150 220 225 257T450 245" fill="none" stroke="#a58058" stroke-width="8" /><path d="M550 250H935" fill="none" stroke="#a58058" stroke-width="8" /><rect x="80" y="315" width="355" height="125" fill="#e8dfd3"/><rect x="565" y="315" width="355" height="125" fill="#e8dfd3"/><path d="M80 310L435 288" fill="none" stroke="#a58058" stroke-width="5" /><path d="M565 290H920" fill="none" stroke="#a58058" stroke-width="5" /><text x="100" y="381" font-size="22" fill="#192d43">수납장</text><text x="590" y="381" font-size="22" fill="#192d43">수납장</text><text x="55" y="485" font-size="24" fill="#192d43">틈 폭이 불규칙하게 보임</text><text x="540" y="485" font-size="24" fill="#192d43">기준선과 마감선 함께 조율</text><text x="38" y="566" font-size="23" fill="#192d43">천장·벽·가구가 만나는 선을 같은 기준으로 확인합니다.</text><text x="38" y="613" font-size="20" fill="#566675">그림은 오차를 과장한 비교이며 실제 허용 오차는 공법별로 정합니다.</text><text x="38" y="649" font-size="18" fill="#566675">공간한쪽 제작 · 설명용 개념도 / 비축척 / 제작·시공도면 아님</text></g></svg>
