<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc"><title id="title">손잡이 홈은 모양보다 손이 들어갈 공간</title><desc id="desc">홈 단면과 도어 열림 방향을 각각 확인합니다. 실물 샘플을 잡아 보고 손톱 걸림·손가락 공간을 확인하세요.</desc><rect width="1000" height="680" rx="16" fill="#f3f6fa"/><g font-family="Malgun Gothic, sans-serif"><text x="36" y="48" font-size="32" fill="#192d43">손잡이 홈은 모양보다 손이 들어갈 공간</text><text x="36" y="86" font-size="24" fill="#192d43">홈 단면과 도어 열림 방향을 각각 확인합니다.</text><rect x="28" y="112" width="456" height="410" fill="white"/><rect x="516" y="112" width="456" height="410" fill="white"/><text x="50" y="153" font-size="26" fill="#192d43">A. 손잡이 홈 단면 예시</text><text x="538" y="153" font-size="26" fill="#192d43">B. 두 도어를 정면에서 보기</text><path d="M140 430V245H205V280Q205 317 250 317H280V430Z" fill="#c7b195" stroke="#9e805d" stroke-width="2"/><path d="M328 279H263Q235 279 235 297" fill="none" stroke="#d9ad8b" stroke-width="22" /><text x="75" y="203" font-size="24" fill="#192d43">파임 깊이·마감 두께</text><text x="87" y="472" font-size="24" fill="#192d43">손가락이 걸리는 면 확인</text><rect x="560" y="200" width="162" height="245" fill="#d8c6ad"/><rect x="744" y="200" width="175" height="245" fill="#e5d9c8"/><rect x="706" y="220" width="16" height="200" fill="#8b7152"/><path d="M699 323H636" fill="none" stroke="#255a96" stroke-width="3" /><text x="571" y="484" font-size="24" fill="#192d43">홈이 있는 면·먼저 여는 문</text><text x="782" y="327" font-size="23" fill="#192d43">도어</text><text x="38" y="566" font-size="23" fill="#192d43">실물 샘플을 잡아 보고 손톱 걸림·손가락 공간을 확인하세요.</text><text x="38" y="613" font-size="20" fill="#566675">홈 형상·개폐 순서는 제품마다 다릅니다. 이 그림은 가공 치수가 아닙니다.</text><text x="38" y="649" font-size="18" fill="#566675">공간한쪽 제작 · 설명용 개념도 / 비축척 / 제작·시공도면 아님</text></g></svg>
