<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc"><title id="title">부츠 높이에 맞춰 선반 위치를 바꿉니다</title><desc id="desc">수납장 정면 · 같은 외형이라도 내부 높이 배분이 다릅니다. 가장 긴 부츠를 세워 실측하고, 넣고 꺼낼 여유를 더해 검토하세요.</desc><rect width="1000" height="680" rx="16" fill="#f3f6fa"/><g font-family="Malgun Gothic, sans-serif"><text x="36" y="48" font-size="32" fill="#192d43">부츠 높이에 맞춰 선반 위치를 바꿉니다</text><text x="36" y="86" font-size="24" fill="#192d43">수납장 정면 · 같은 외형이라도 내부 높이 배분이 다릅니다.</text><rect x="28" y="112" width="456" height="410" fill="white"/><rect x="516" y="112" width="456" height="410" fill="white"/><text x="50" y="153" font-size="26" fill="#192d43">A. 낮은 칸만 반복</text><text x="538" y="153" font-size="26" fill="#192d43">B. 긴 신발을 위한 높은 칸</text><rect x="95" y="190" width="325" height="295" fill="#eee6db"/><rect x="580" y="190" width="325" height="295" fill="#eee6db"/><rect x="95" y="265" width="325" height="9" fill="#a78763"/><rect x="95" y="338" width="325" height="9" fill="#a78763"/><rect x="95" y="411" width="325" height="9" fill="#a78763"/><rect x="580" y="265" width="155" height="9" fill="#a78763"/><rect x="580" y="411" width="155" height="9" fill="#a78763"/><rect x="738" y="190" width="8" height="295" fill="#a78763"/><path d="M145 452V291H186V427H221Q237 427 237 452Z" fill="#637487"/><path d="M786 452V291H827V427H862Q878 427 878 452Z" fill="#637487"/><circle cx="895" cy="230" r="4" fill="#8e7861"/><circle cx="895" cy="265" r="4" fill="#8e7861"/><circle cx="895" cy="300" r="4" fill="#8e7861"/><circle cx="895" cy="335" r="4" fill="#8e7861"/><circle cx="895" cy="370" r="4" fill="#8e7861"/><circle cx="895" cy="405" r="4" fill="#8e7861"/><circle cx="895" cy="440" r="4" fill="#8e7861"/><text x="55" y="504" font-size="20" fill="#192d43">긴 부츠와 선반이 겹침</text><text x="544" y="504" font-size="20" fill="#192d43">선반 조절 구멍·하중도 확인</text><text x="38" y="566" font-size="23" fill="#192d43">가장 긴 부츠를 세워 실측하고, 넣고 꺼낼 여유를 더해 검토하세요.</text><text x="38" y="613" font-size="20" fill="#566675">젖은 신발의 건조·청소 조건은 별도로 계획합니다.</text><text x="38" y="649" font-size="18" fill="#566675">공간한쪽 제작 · 설명용 개념도 / 비축척 / 제작·시공도면 아님</text></g></svg>
