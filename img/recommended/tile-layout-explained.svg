<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc"><title id="title">큰 타일도 시작점을 바꾸면 재단이 달라집니다</title><desc id="desc">위에서 본 현관 · 동일한 타일 규격의 줄눈 배치 비교 타일 크기만 고르지 말고 줄눈·재단 배치도를 함께 요청하세요.</desc><rect width="1000" height="680" rx="16" fill="#f3f6fa"/><g font-family="Malgun Gothic, sans-serif"><text x="36" y="48" font-size="32" fill="#192d43">큰 타일도 시작점을 바꾸면 재단이 달라집니다</text><text x="36" y="86" font-size="24" fill="#192d43">위에서 본 현관 · 동일한 타일 규격의 줄눈 배치 비교</text><rect x="28" y="112" width="456" height="410" fill="white"/><rect x="516" y="112" width="456" height="410" fill="white"/><text x="50" y="153" font-size="26" fill="#192d43">A. 한쪽 끝부터 시작</text><text x="538" y="153" font-size="26" fill="#192d43">B. 양 끝 재단을 나누기</text><rect x="70" y="195" width="375" height="280" fill="#e8dfd0"/><rect x="555" y="195" width="375" height="280" fill="#e8dfd0"/><path d="M70 195V475" fill="none" stroke="#a89984" stroke-width="2" /><path d="M190 195V475" fill="none" stroke="#a89984" stroke-width="2" /><path d="M310 195V475" fill="none" stroke="#a89984" stroke-width="2" /><path d="M430 195V475" fill="none" stroke="#a89984" stroke-width="2" /><path d="M445 195V475" fill="none" stroke="#a89984" stroke-width="2" /><path d="M555 195V475" fill="none" stroke="#a89984" stroke-width="2" /><path d="M622.5 195V475" fill="none" stroke="#a89984" stroke-width="2" /><path d="M742.5 195V475" fill="none" stroke="#a89984" stroke-width="2" /><path d="M862.5 195V475" fill="none" stroke="#a89984" stroke-width="2" /><path d="M930 195V475" fill="none" stroke="#a89984" stroke-width="2" /><path d="M70 315H445M555 315H930" fill="none" stroke="#a89984" stroke-width="2" /><path d="M70 435H445M555 435H930" fill="none" stroke="#a89984" stroke-width="2" /><rect x="431" y="195" width="13" height="280" fill="#d29a82"/><text x="63" y="505" font-size="19" fill="#192d43">한쪽에 좁은 자투리가 남음</text><text x="543" y="505" font-size="19" fill="#192d43">중심·문·장 끝선까지 비교</text><text x="38" y="566" font-size="23" fill="#192d43">타일 크기만 고르지 말고 줄눈·재단 배치도를 함께 요청하세요.</text><text x="38" y="613" font-size="20" fill="#566675">배치안에 따라 손실률이 달라집니다. 정답은 현장 치수와 디자인에 따라 다릅니다.</text><text x="38" y="649" font-size="18" fill="#566675">공간한쪽 제작 · 설명용 개념도 / 비축척 / 제작·시공도면 아님</text></g></svg>
