<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc"><title id="title">같은 거울도 벽의 준비 깊이에 따라 달라집니다</title><desc id="desc">옆 단면 비교 · 거울과 접착·받침층을 모두 포함합니다. 매립 깊이는 거울 선정 후 정하고, 파손 시 교체 방법도 계획합니다.</desc><rect width="1000" height="680" rx="16" fill="#f3f6fa"/><g font-family="Malgun Gothic, sans-serif"><text x="36" y="48" font-size="32" fill="#192d43">같은 거울도 벽의 준비 깊이에 따라 달라집니다</text><text x="36" y="86" font-size="24" fill="#192d43">옆 단면 비교 · 거울과 접착·받침층을 모두 포함합니다.</text><rect x="28" y="112" width="456" height="410" fill="white"/><rect x="516" y="112" width="456" height="410" fill="white"/><text x="50" y="153" font-size="26" fill="#192d43">A. 완성된 벽 위에 붙임</text><text x="538" y="153" font-size="26" fill="#192d43">B. 미리 깊이를 계획함</text><rect x="100" y="200" width="100" height="260" fill="#d2d8dc"/><rect x="200" y="250" width="15" height="165" fill="#dbbd91"/><rect x="215" y="250" width="14" height="165" fill="#8eb6d0"/><path d="M200 183V477" fill="none" stroke="#255a96" stroke-width="2" stroke-dasharray="8 6"/><text x="87" y="496" font-size="24" fill="#192d43">거울이 벽보다 돌출</text><text x="120" y="230" font-size="24" fill="#192d43">벽</text><rect x="620" y="200" width="100" height="260" fill="#d2d8dc"/><rect x="691" y="250" width="29" height="165" fill="white"/><rect x="691" y="250" width="15" height="165" fill="#dbbd91"/><rect x="706" y="250" width="14" height="165" fill="#8eb6d0"/><path d="M720 183V477" fill="none" stroke="#255a96" stroke-width="2" stroke-dasharray="8 6"/><text x="566" y="496" font-size="24" fill="#192d43">거울 표면과 벽 표면 정렬</text><text x="638" y="230" font-size="24" fill="#192d43">벽</text><path d="M819 321H728" fill="none" stroke="#255a96" stroke-width="3" /><text x="773" y="301" font-size="24" fill="#192d43">완성면</text><text x="38" y="566" font-size="23" fill="#192d43">매립 깊이는 거울 선정 후 정하고, 파손 시 교체 방법도 계획합니다.</text><text x="38" y="613" font-size="20" fill="#566675">기존 벽을 임의로 파내지 않습니다. 배선·보강·바탕 조건을 먼저 확인합니다.</text><text x="38" y="649" font-size="18" fill="#566675">공간한쪽 제작 · 설명용 개념도 / 비축척 / 제작·시공도면 아님</text></g></svg>
