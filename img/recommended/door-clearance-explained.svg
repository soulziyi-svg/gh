<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc"><title id="title">문짝 너비와 실제 통과 폭은 다릅니다</title><desc id="desc">위에서 본 문 · 열린 문과 주변 물건까지 함께 확인합니다. 큰 짐을 옮길 폭 + 손잡이 돌출 + 열림 각도를 함께 확인하세요.</desc><rect width="1000" height="680" rx="16" fill="#f3f6fa"/><g font-family="Malgun Gothic, sans-serif"><text x="36" y="48" font-size="32" fill="#192d43">문짝 너비와 실제 통과 폭은 다릅니다</text><text x="36" y="86" font-size="24" fill="#192d43">위에서 본 문 · 열린 문과 주변 물건까지 함께 확인합니다.</text><rect x="28" y="112" width="456" height="410" fill="white"/><rect x="516" y="112" width="456" height="410" fill="white"/><text x="50" y="153" font-size="26" fill="#192d43">A. 문을 닫았을 때</text><text x="538" y="153" font-size="26" fill="#192d43">B. 문을 열었을 때</text><rect x="65" y="240" width="55" height="35" fill="#dce3e8"/><rect x="415" y="240" width="40" height="35" fill="#dce3e8"/><rect x="120" y="250" width="295" height="14" fill="#b59169"/><path d="M120 215H415" fill="none" stroke="#255a96" stroke-width="3" /><text x="163" y="204" font-size="23" fill="#192d43">문짝 너비</text><rect x="550" y="240" width="55" height="35" fill="#dce3e8"/><rect x="900" y="240" width="35" height="35" fill="#dce3e8"/><path d="M605 258V480" fill="none" stroke="#b59169" stroke-width="14" /><path d="M900 258A295 222 0 0 1 605 480" fill="none" stroke="#9badbf" stroke-width="2" stroke-dasharray="7 6"/><rect x="842" y="310" width="80" height="140" fill="#c8baa7"/><text x="815" y="480" font-size="23" fill="#192d43">신발장</text><path d="M626 345H828" fill="none" stroke="#255a96" stroke-width="3" /><text x="642" y="330" font-size="22" fill="#192d43">통과 공간</text><text x="69" y="413" font-size="23" fill="#192d43">문틀 안쪽 치수와</text><text x="69" y="447" font-size="23" fill="#192d43">문짝 치수도 구분합니다.</text><text x="38" y="566" font-size="23" fill="#192d43">큰 짐을 옮길 폭 + 손잡이 돌출 + 열림 각도를 함께 확인하세요.</text><text x="38" y="613" font-size="20" fill="#566675">방화문 변경·무거운 문 탈착은 전문가 검토 항목입니다.</text><text x="38" y="649" font-size="18" fill="#566675">공간한쪽 제작 · 설명용 개념도 / 비축척 / 제작·시공도면 아님</text></g></svg>
