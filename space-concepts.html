<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공간별 디자인 10안 | ROOM PICK</title><link rel="stylesheet" href="css/space-concepts.css"></head><body>

<main><section class="hero"><p>ROOM PICK · 10 CONCEPTS</p><h1 id="title">공간 디자인 10안</h1><span id="intro"></span></section><section class="grid" id="conceptGrid" aria-live="polite"></section><section class="guide"><div><small>HOW TO CHOOSE</small><h2>스타일 이름보다<br>생활 조건으로 고르세요.</h2></div><ol><li><b>01</b><span>현재 구조에서 유지할 부분을 먼저 표시합니다.</span></li><li><b>02</b><span>좋아하는 안 2~3개에서 색·재료·조명을 따로 고릅니다.</span></li><li><b>03</b><span>셀프·반셀프·턴키 범위와 예산에 맞춰 하나의 안으로 조정합니다.</span></li></ol></section></main>
<script>const data={bathroom:{title:'욕실 디자인 10안',intro:'방수와 배수는 지키면서 타일·도장·수납·조명의 강도를 달리한 열 가지 방향입니다.',img:'bathroom',names:['웜 미니멀','노르딕 스파','소프트 콘크리트','라이트 오크','호텔 모던','화이트 미니멀','뮤트 블루 타일','스톤 베이지','콤팩트 실용형','패밀리 배리어프리']},kitchen:{title:'주방 디자인 10안',intro:'기존 몸통 활용부터 동선 전체 재설계까지, 공사 강도와 분위기가 다른 열 가지 주방입니다.',img:'kitchen',names:['노르딕 화이트 오크','웜 베이지','그레이지 아일랜드','콤팩트 갤리','세이지 포인트','모던 클래식','스테인리스 프로','내추럴 스톤','패밀리 다이닝','필름·부분보수']},living:{title:'거실 디자인 10안',intro:'벽지·도장·몰딩·조명과 가구 배치만으로도 달라지는 거실의 열 가지 해법입니다.',img:'living',names:['노르딕 캄','웜 미니멀','콰이어트 럭셔리','소프트 클래식','내추럴 오크','화이트 갤러리','코지 패밀리','뮤트 컬러','콤팩트 실용형','이브닝 라이트']},bedroom:{title:'침실 디자인 10안',intro:'수면과 수납을 중심으로 벽지·조명·가구의 균형을 달리한 열 가지 침실입니다.',img:'bedroom',names:['노르딕 캄','웜 미니멀','호텔 스위트','수납 집중형','소프트 블루','내추럴 오크','모던 클래식','리딩 리트리트','패밀리 침실','벽지·조명 리프레시']}};const key=new URLSearchParams(location.search).get('space')||'living',d=data[key]||data.living;title.textContent=d.title;intro.textContent=d.intro;document.title=d.title+' | ROOM PICK';conceptGrid.innerHTML=d.names.map((n,i)=>`<article><div class="shot shot--${d.img}" style="--x:${i%5};--y:${Math.floor(i/5)}" role="img" aria-label="${n} 디자인"></div><div><small>CONCEPT ${String(i+1).padStart(2,'0')}</small><h2>${n}</h2><p>${i<3?'현재 구조를 최대한 살려 마감과 조명 중심으로 변화합니다.':i<7?'생활 동선과 수납을 보완하며 필요한 공정을 선별합니다.':'구조와 설비 조건을 확인해 디자인 완성도를 높이는 안입니다.'}</p></div></article>`).join('');</script></body></html>
