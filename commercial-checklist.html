<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>상업공간 실전 체크리스트 | ROOM PICK</title><link rel="stylesheet" href="css/commercial-checklist.css"></head><body><header><a href="store.html"><img src="img/room-pick-logo.png" alt="ROOM PICK"></a><a href="store.html#start">매장 사진으로 시작하기</a></header><main><section class="hero"><small>COMMERCIAL SPACE · FIELD CHECK</small><h1>상업공간은 디자인과<br>운영 조건을 함께 봅니다.</h1><p>카페·리테일·오피스·클리닉의 공통 기준을 고객 경험, 직원 효율, 법정 조건과 유지관리 순서로 확인하세요.</p></section><nav id="quick"></nav><section id="list" class="list"></section><section class="closing"><small>ROOM PICK STANDARD</small><h2>도면에 보이는 것과<br>영업 중에 느끼는 것을 연결합니다.</h2><p>상업공간의 실제 적용 가능 여부는 건축물 용도, 지역 조례, 소방·위생·전기 설비와 임대차 조건을 현장에서 확인한 뒤 확정합니다.</p></section></main><script>const items=[['고객 동선','입구에서 주문·체류·퇴장까지 막힘 없는 흐름','주 동선 폭, 대기열, 좌석 간격','바닥에 실제 동선을 표시하고 피크 시간의 교차 지점을 확인하세요.'],['파사드·간판','거리에서 업종과 입구가 즉시 읽히는 시야','간판 허가, 야간 밝기, 유리 반사','보행자와 차량의 접근 방향에서 낮과 밤을 각각 촬영하세요.'],['직원 작업 동선','준비·제조·서빙·세척이 짧게 연결되는 배치','설비 간 거리, 교차 작업, 수납 위치','대표 메뉴 한 건의 작업 순서를 실제 몸동작으로 검증하세요.'],['진열·조명','상품의 색과 질감이 정확히 보이는 빛','연색성, 눈부심, 조도 차이','영업 시간대에 상품 표면과 고객 눈높이에서 확인하세요.'],['접근성','문턱과 문 폭, 회전 공간을 확보한 출입','유효 폭, 경사, 손잡이, 화장실','휠체어·유모차의 입장부터 이용까지 끊김 없이 점검하세요.'],['전기·통신·POS','기기 위치와 전력·데이터를 운영 시나리오에 연결','전용 회로, 콘센트, 통신, 예비 용량','전체 기기 목록과 소비전력을 확정한 뒤 벽을 마감하세요.'],['소방·피난','어디서든 출구가 보이고 막히지 않는 계획','피난 거리, 유도등, 감지기, 방염','가구·진열 설치 후에도 피난 설비의 시야와 접근을 재확인하세요.'],['내구·청소 마감','오염과 충격이 집중되는 경계를 오래 쓰는 디테일','바닥 접합, 걸레받이, 코너, 교체성','청소 도구와 약품, 물 사용 구역을 기준으로 샘플을 시험하세요.']];quick.innerHTML=items.map((x,i)=>`<a href="#check-${i+1}">${String(i+1).padStart(2,'0')} ${x[0]}</a>`).join('');list.innerHTML=items.map((x,i)=>`<article id="check-${i+1}"><div class="photo" style="--x:${i%4};--y:${Math.floor(i/4)}" role="img" aria-label="${x[0]} 점검 장면"></div><div><small>CHECK ${String(i+1).padStart(2,'0')}</small><h2>${x[0]}</h2><h3>${x[1]}</h3><dl><dt>현장에서 볼 것</dt><dd>${x[2]}</dd><dt>룸픽 확인 방법</dt><dd>${x[3]}</dd></dl><label><input type="checkbox"> 이 항목을 확인했습니다</label></div></article>`).join('');</script></body></html>
